[project]
name = "footy-sql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "franc-LENOVO", email = "franciscofigueiredo2580@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "duckdb>=2.0.0",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
footy = "footy_sql:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "P7D"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
